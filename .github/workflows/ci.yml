# Ticket 0: the same four checks as the team runs by hand, on every PR to main or v2. No secret: tests that need a
# real key skip themselves when it is absent. Windows is the final target PC, so its job runs too; its failures are
# listed in the PR, not fixed by this workflow (ticket 0, out of scope).
name: CI

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: test, lint, tsc, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
